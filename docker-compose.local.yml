services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: digital_inventory_pos_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  mysql:
    image: mysql:8.0
    container_name: digital_inventory_pos_mysql
    environment:
      MYSQL_DATABASE: digital_inventory_pos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - digital_inventory_pos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  digital_inventory_pos_mysql_data:
